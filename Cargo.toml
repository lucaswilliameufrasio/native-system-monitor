[workspace]
resolver = "3"
members = [
    "apps/agent",
    "apps/desktop",
    "apps/monitorctl",
    "crates/agent-lifecycle",
    "crates/collector-api",
    "crates/collectors-common",
    "crates/collectors-linux",
    "crates/collectors-nvidia",
    "crates/domain",
    "crates/exporters",
    "crates/ipc",
    "crates/settings",
]

[workspace.package]
edition = "2024"
license = "MIT"
rust-version = "1.95"
version = "0.1.0"

[workspace.dependencies]
anyhow = "1.0"
interprocess = { version = "2.4.7", features = ["tokio"] }
libc = "0.2"
prost = "0.14"
prost-build = "0.14"
protoc-bin-vendored = "3.2"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }
serde = { version = "1.0", features = ["derive"] }
snap = "1.1.2"
slint = "1.18.1"
slint-build = "1.18.1"
sys-locale = "0.3.2"
sysinfo = { version = "0.39.6", default-features = false, features = ["disk", "network", "system"] }
nvml-wrapper = "0.13"
thiserror = "2.0"
tokio = { version = "1.48", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
url = "2.5"
widestring = "1.2"

[workspace.lints.rust]
unsafe_code = "deny"
unused_must_use = "deny"
