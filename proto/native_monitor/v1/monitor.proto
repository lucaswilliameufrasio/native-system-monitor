syntax = "proto3";

package native_monitor.v1;

enum Operation {
  OPERATION_UNSPECIFIED = 0;
  OPERATION_STATUS = 1;
  OPERATION_CAPABILITIES = 2;
  OPERATION_SNAPSHOT = 3;
  OPERATION_PROCESSES = 4;
}

message Request {
  uint32 protocol_major = 1;
  Operation operation = 2;
  uint32 process_limit = 3;
  string sort_by = 4;
  uint32 protocol_minor = 5;
  string process_filter = 6;
  optional bool sort_descending = 7;
  string process_sort_key = 8;
}

message Response {
  uint32 protocol_major = 1;
  string error_code = 2;
  string error_message = 3;
  string status = 4;
  repeated Capability capabilities = 5;
  Snapshot snapshot = 6;
  uint32 protocol_minor = 7;
}

message Capability {
  string name = 1;
  string status = 2;
  string source = 3;
}

message Snapshot {
  uint64 captured_at_unix_ms = 1;
  CpuMetrics cpu = 2;
  MemoryMetrics memory = 3;
  repeated ProcessMetrics processes = 4;
  repeated float cpu_history_percent = 5;
  repeated float memory_history_percent = 6;
  string collection_status = 7;
  uint64 history_interval_ms = 8;
  repeated VolumeMetrics volumes = 9;
  repeated NetworkInterfaceMetrics network_interfaces = 10;
  repeated BlockDeviceMetrics block_devices = 11;
  string block_device_io_status = 12;
  repeated GpuMetrics gpus = 13;
  string gpu_status = 14;
  repeated BatteryMetrics batteries = 15;
  string battery_status = 16;
}

message CpuMetrics {
  optional float total_usage_percent = 1;
  repeated float per_core_usage_percent = 2;
  string status = 3;
}

message MemoryMetrics {
  optional uint64 total_bytes = 1;
  optional uint64 used_bytes = 2;
  optional uint64 swap_total_bytes = 3;
  optional uint64 swap_used_bytes = 4;
  string status = 5;
}

message VolumeMetrics {
  string mount_point = 1;
  string file_system = 2;
  optional uint64 total_bytes = 3;
  optional uint64 available_bytes = 4;
  optional double read_bytes_per_second = 5;
  optional double write_bytes_per_second = 6;
}

message NetworkInterfaceMetrics {
  string name = 1;
  optional double received_bytes_per_second = 2;
  optional double transmitted_bytes_per_second = 3;
}

message BlockDeviceMetrics {
  string id = 1;
  string name = 2;
  optional double read_bytes_per_second = 3;
  optional double write_bytes_per_second = 4;
  optional double read_operations_per_second = 5;
  optional double write_operations_per_second = 6;
  optional double busy_percent = 7;
  optional double read_latency_ms = 8;
  optional double write_latency_ms = 9;
}

message GpuMetrics {
  string id = 1;
  string name = 2;
  optional float utilization_percent = 3;
  optional uint64 memory_used_bytes = 4;
  optional uint64 memory_total_bytes = 5;
  optional uint32 temperature_celsius = 6;
  optional uint32 graphics_clock_mhz = 7;
  optional uint32 memory_clock_mhz = 8;
  optional double power_watts = 9;
}

message BatteryMetrics {
  string id = 1;
  optional string model = 2;
  optional string status = 3;
  optional uint32 capacity_percent = 4;
  optional double energy_now_wh = 5;
  optional double energy_full_wh = 6;
  optional double power_watts = 7;
  optional double temperature_celsius = 8;
  optional uint32 cycle_count = 9;
}

message ProcessMetrics {
  uint32 pid = 1;
  optional uint32 parent_pid = 2;
  string name = 3;
  optional float cpu_usage_percent = 4;
  uint64 memory_bytes = 5;
  uint64 start_time_unix_seconds = 6;
}
