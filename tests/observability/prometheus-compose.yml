services:
  prometheus:
    image: prom/prometheus:v3.15.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --web.listen-address=0.0.0.0:9090
      - --web.enable-remote-write-receiver
      - --storage.tsdb.retention.time=1d
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-19090}:9090"
