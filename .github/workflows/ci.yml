name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Quality (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - macos-15
          - windows-2025

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, verified 2026-11-08

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes libfontconfig1-dev

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1, verified 2026-11-08
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy
          cache: false

      - name: Install cargo-audit
        if: runner.os == 'Linux'
        run: cargo install cargo-audit --version 0.22.2 --locked

      - name: Audit Rust dependencies
        if: runner.os == 'Linux'
        run: cargo audit

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Run tests
        env:
          SLINT_EMIT_DEBUG_INFO: "1"
        run: cargo test --workspace --locked

      - name: Build workspace
        run: cargo build --workspace --locked
